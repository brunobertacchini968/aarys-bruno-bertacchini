replicaCount: 2

image:
  repository: gamecloud-ranking
  tag: "1.0"
  pullPolicy: Never

containerPort: 8080

service:
  type: ClusterIP
  port: 80

fallas:
  errorRate: "0"
  latenciaMs: "0"
  fallarAlIniciar: "false"

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 250m, memory: 128Mi }

trafico:
  enabled: true
  image: curlimages/curl:8.11.1
  pausaSegundos: "0.5"
